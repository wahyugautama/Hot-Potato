<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#090b18" />
    <title>Hot Potato</title>
  </head>
  <body>
    <main id="app" aria-label="Hot Potato game">
      <section id="hud" class="hud is-hidden" aria-live="polite">
        <div class="hud__brand">HOT POTATO<small id="arena-name">CLASSIC</small></div>
        <div class="hud__meta"><span id="players-left">4 players</span><span id="bomb-holder">Bomb: —</span></div>
        <div id="timer" class="hud__timer">15.0</div>
        <div id="round-status" class="hud__status">Get ready!</div>
        <div id="round-number" class="hud__round">ROUND 1</div>
        <button id="mute-button" class="mute" type="button" aria-label="Mute sound">♪</button>
      </section>
      <div id="game" aria-label="Game arena"></div>
      <section id="controls" class="controls is-hidden">
        <div id="joystick" class="joystick" aria-label="Virtual movement joystick"><div id="joystick-ring" class="joystick__ring"><div id="joystick-knob" class="joystick__knob"></div></div></div>
        <p>MOVE<br><span>WASD / ARROWS</span></p>
        <button id="dash-button" class="dash" type="button" aria-label="Dash"><span id="dash-progress"></span><b>DASH</b><small id="dash-cooldown">READY</small></button>
      </section>
      <section id="menu" class="screen menu">
        <div class="menu__bomb" aria-hidden="true">●<i></i></div>
        <h1>HOT<br><span>POTATO</span></h1>
        <p>Pass it before it blows.</p>
        <button id="play-button" type="button">PLAY <span>→</span></button>
        <small>1 player vs 3 bots</small>
      </section>
      <section id="winner" class="screen winner is-hidden" aria-live="assertive">
        <p>LAST ONE STANDING</p>
        <h2 id="winner-name">YOU WIN!</h2>
        <button id="restart-button" type="button">PLAY AGAIN <span>↻</span></button>
      </section>
      <div id="toast" class="toast" aria-live="assertive"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
